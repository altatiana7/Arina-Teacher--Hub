.wrong{font-size:15px;color:#991b1b;text-decoration:line-through;text-decoration-color:#ef4444}
.right{font-size:15px;font-weight:800;color:#166534}

ssil fuel."],"a":[4,8,2,6,7,5,1]},"r11":{"topic":"work","n":9,"title":"Improving punctuality","p":["Some people fall into the trap of thinking that it's really no big deal to be consistently late. There’s a saying that goes, “90% of life is just showing up”. If that's the case, then showing up on time is 100% of life!","There are {{A}} others wait for you. If you keep your friends waiting too often, they’ll start to think that you don’t care about your friendship enough to be there on time.","Being consistently late for your job is grounds for contract termination at most workplaces, while being late {{B}} on important information. Whatever the situation, there are always benefits of being on time, while there are rarely ever benefits of being late.","First, you’re only using more energy by being late. Having to come up with an excuse for {{C}} to do it too often.","You could concentrate {{D}} time, freeing up your mental resources. Being late also causes stress, so you’ll save yourself from a stressful situation just by arriving at the correct time.","Think about it this way: if you come to work on time every day while another co-worker has a less-than-stellar record when it comes to tardiness, who will the bosses be more willing to promote? All other things being equal, being punctual will display good time management skills, {{E}}.","However you look at it, it’s always going to be more advantageous to arrive at your destination on time. The negative {{F}} any positive aspects. Make punctuality a part of your personality."],"parts":["for class could cause you to miss out","your lateness is mentally draining if you have","very few situations where it’s not rude to make","consequences of being late always far outweigh","on more important things instead by simply being on","aspect of being on time is that you may find yourself","and that could mean the difference in getting you the next promotion"],"a":[3,1,2,5,7,4]},"r12":{"topic":"education","n":17,"title":"Will online education replace classroom education anytime soon?","p":["Over the last decade, the number of people taking online courses and using technology as a tool to enhance their education has increased dramatically. You can now master a foreign language or complete a whole degree without leaving the comfort of your sofa. You can decide not only when you want to learn but also how you want to learn. Meanwhile, the range of technology used inside the classroom has also boomed, with the rise of smartboards, digital textbooks and, most notably, the tools offered on the Internet. But what does this mean for teachers? While many teachers are excited by technology, others are concerned by its rapid development. They wonder whether they themselves could be replaced.","Technology gives us abundant opportunities. In a geography lesson, we can now transport students to explore another country. In an English class, we can take them back in time to experience Shakespeare’s plays as they were performed during his lifetime. Students are able to watch videos at home that explain how to use algebra, or allow them to see first-hand the life cycle of a plant. Technology doesn’t discriminate based on a student’s ability or skill. It provides an opportunity to engage students using a medium that they recognise. Technology is growing not just within our classrooms but also in our everyday lives, so it is natural that we should increasingly incorporate it into classrooms.","Crucially, the use of technology in the classroom doesn’t lessen the need for great teachers. In fact, it is great teachers who make using technology so significant in students’ education. Whilst technology is able to take on a whole host of tasks, it does have its shortcomings. The most prominent drawback is its inability to interact with humans. Technology can facilitate the learning process. However, it cannot replace the role of the teacher. Computers do not teach children to question, to discriminate among sources le."]},{"q":"Which statement about the use of technology is FALSE, according to the text?","o":["Technology gives everyone equal chances.","It provides the environment students are used to.","We cannot avoid technology, so we should use it.","Students should use technology at home."]},{"q":"Discriminate in Paragraph 3 (“Computers do not teach children to question, to discriminate among sources of information ...”) most probably means …","o":["favour.","distinguish.","judge.","characterise."]},{"q":"Which advantage of human teachers over technology is NOT mentioned in Paragraph 3?","o":["Development of critical thinking skills.","Awareness of students’ personal characteristics.","Student involvement and motivation.","Communication and interaction."]},{"q":"Before using technology, a teacher has to find out if it is …","o":["modern.","safe.","suitable.","enjoyable."]},{"q":"The author draws the conclusion that technology …","o":["will substitute teachers in the distant future.","can help teachers but cannot replace them.","will never be as effective as human teachers.","cannot be trusted as human teachers are."]}],"a":[3,1,4,2,2,3,2]}};

let w3Get=function(id){try{return JSON.parse(localStorage.getItem('arinaTask:'+id)||'{}')}catch(e){return {}}};
function w3Set(id,st){try{localStorage.setItem('arinaTask:'+id,JSON.stringify(st))}catch(e){}}
function w3Esc(v){return String(v==null?'':v).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function w3Plain(html){const d=document.createElement('div');d.innerHTML=html;return d.textContent.replace(/\s+/g,' ').trim()}
function w3Norm(s){
 return String(s||'').toLowerCase().replace(/[’‘`´]/g,"'").replace(/[.,!?;:]/g,' ')
  .replace(/\bwon't\b/g,'will not').replace(/\bcan't\b/g,'cannot').replace(/n't\b/g,' not')
  .replace(/'ll\b/g,' will').replace(/'m\b/g,' am').replace(/'re\b/g,' are').replace(/'ve\b/g,' have')
  .replace(/\b(it|he|she|that|there)'s\b/g,'$1 is').replace(/^'s\b/,'is').replace(/\s+/g,' ').trim();
}
function w3Match(value,accepted){const v=w3Norm(value);return !!v&&accepted.some(a=>w3Norm(a)===v)}
/* Sends one result to the teacher. If the network fails, the result waits in a queue and is re-sent automatically. */
async function arinaSendResult(payload){
 try{const saved=await saveArinaHomework(payload);return {ok:true,code:(saved&&saved.code)||''}}
 catch(e){
  try{const q=JSON.parse(localStorage.getItem('arinaPendingResults')||'[]');if(!q.some(x=>x.test_id===payload.test_id))q.push(payload);localStorage.setItem('arinaPendingResults',JSON.stringify(q))}catch(_){}
  return {ok:false,code:''};
 }
}
async function arinaFlushPending(){
 let q=[];try{q=JSON.parse(localStorage.getItem('arinaPendingResults')||'[]')}catch(e){}
 if(!q.length)return;
 const left=[];
 for(const p of q){
  try{const saved=await saveArinaHomework(p);const st=w3Get(p.test_id);if(st.done){st.done.pending=false;st.done.code=(saved&&saved.code)||'';w3Set(p.test_id,st)}}
  catch(e){left.push(p)}
 }
 try{localStorage.setItem('arinaPendingResults',JSON.stringify(left))}catch(e){}
 w3Refresh();
}

ted calling it “Flatiron” because of its unusual shape. The name stuck and soon became official.", "How does Rockefeller Center manage to find the perfect fur-tree each Christmas season? They do aerial searches by helicopter, of course, and bring it to the city during the night when there isn’t much traffic on the streets. After the tree is taken down for the year, it continues to be useful. For example, in 2005 Habitat for Humanity used the wood to make doorframes for houses for the poor and in 2012 the paper was used to publish a book.", "In New York life never stands still. People have to call cabs, ride subway cars, do business of all kinds, eat pizzas and sandwiches for lunch. When you multiply that by more than eight million people in less than 500 square miles, you get the idea: everyone goes everywhere as fast as it is humanly possible. Whatever you do, don't stop in the middle of the sidewalk or you’ll make everyone around you incredibly angry.", "New York is extremely easy to navigate. Manhattan is divided into numbered streets from north to south and avenues from east to west. It’s almost impossible to get lost there. Buses are useful to travel around Manhattan, and the subway is the best means of transport to the other parts of the city. At some stage you’ll definitely use a yellow taxi. Try to get one on an avenue that’s going in the same direction you are – you’ll save time and money. And don’t forget to leave a tip for the driver."], "a": [5, 4, 3, 8, 7, 1, 6]},L='ABCDEFG',nums=n=>Array.from({length:n},(_,i)=>String(i+1)),list=a=>'<ol class="rdList">'+a.map(x=>'<li>'+x+'</li>').join('')+'</ol>',heads=R.h.map((h,i)=>(i+1)+'. '+h);

function spkRender(id){const r=document.getElementById('spkRoot');if(r)r.innerHTML=spkHTML(id)}
function spkTick(){const r=document.getElementById('spkRing'),s=document.getElementById('spkSec');if(!r||!s){spkStop();return}r.style.setProperty('--p',w3Speak.left/40*100);s.textContent=w3Speak.left;r.classList.toggle('end',w3Speak.left<=0)}
function spkStop(){if(w3Speak.audio){w3Speak.audio.onended=null;w3Speak.audio.pause();w3Speak.audio=null}if(w3Speak.timer){clearInterval(w3Speak.timer);w3Speak.timer=null}if('speechSynthesis' in window)speechSynthesis.cancel()}
function spkPlay(id){
 const q=taskDef(id).items[w3Speak.i];spkStop();w3Speak.left=40;spkTick();
 const go=()=>{w3Speak.timer=setInterval(()=>{w3Speak.left=Math.max(0,w3Speak.left-1);spkTick();if(w3Speak.left<=0){clearInterval(w3Speak.timer);w3Speak.timer=null}},1000)};
 if(q[2]){w3Speak.audio=new Audio(q[2]);w3Speak.audio.onended=go;w3Speak.audio.play().catch(go)}else go();
}
function spkGo(id,k){spkStop();if(typeof recStop==='function')recStop();w3Speak.i=Math.max(0,Math.min(taskDef(id).items.length-1,k));w3Speak.left=40;w3Speak.flip=false;spkRender(id)}
function spkFlip(id){spkStop();w3Speak.left=40;w3Speak.flip=!w3Speak.flip;spkRender(id)}

 intro:'Словообразование в формате ЕГЭ. Сначала закрой слово справа и реши, какая часть речи нужна, потом образуй слово.',sets:[{"title": "Sakhalin · 25–27", "start": 25, "lines": [["The island of Sakhalin is situated in the Far East of Russia in the North Pacific, between the Sea of Okhotsk and the Sea of Japan. ___ say that it is the largest island in Russia with a length of 948 km, and a width of 25 to 170 km, and a total area of about 78,000 square kilometers.", "SCIENCE", ["scientists"], ""], ["Nearly two-thirds of Sakhalin is mountainous. Two parallel ranges of ___ mountains separate the island from north to south.", "BEAUTY", ["beautiful"], ""], ["The ___ of Sakhalin region is in Yuzhno-Sakhalinsk, which was founded in 1882.", "GOVERN", ["government"], ""]]}, {"title": "Sakhalin · 28–29", "start": 28, "lines": [["It is located in the southern part of the island and the ___ of the modern city comes to about 180 thousand people.", "POPULATE", ["population"], ""], ["___ to the area can enjoy watching gorgeous nature as well as go fishing and rock climbing.", "VISIT", ["visitors"], ""]]}]};
W3_TASKS['w4l1-r10']={label:W4L,part:'B',title:'Чтение 10 · на время · 10 минут',sub:'Открытый банк ФИПИ · 7 текстов, 8 заголовков',type:'read',timer:10,
 intro:'Задание 10 на время: 10 минут. Заголовок — о чём весь текст, а не совпавшее слово.',sets:rdBuild10({"topic": "travelling", "n": 11, "h": ["Pet-friendly booking", "Funny names", "Different tactics", "Seeing wild animals", "Almost at the shore", "Seaside observation point", "Quiet places to explore", "Various activities to do"], "t": ["The English have a very ironic sense of humour, and it may become clear when you discover what some of the towns and villages across England and the United Kingdom are called. Some are hilarious, while others are just plain rude. It is important to keep an eye out when you pass through the English countryside to see if you can spot a few on your travels. There’s Sheepy Parva and Sheepy Magna in Lancashire, Greedy Gut in Somerset, No Place in Derbyshire. There is always something to keep people entertained during their trip!", "England is part of the British Isles and a large archipelago off the coast of Europe. It is not a very big country. In fact, you could fit all the United Kingdom, that is, England, Wales, Scotland, and Northern Ireland, inside Texas, the USA, over 2.8 times. So, it shouldn’t come as too much surprise to know that you are never far from the sea when you are in England. In fact, even if you are standing in the very center of the country, you are still no more than 70 miles away from the coast. What a shame that the English weather doesn’t often encourage a beach day!", "Badgers are not always a farmer’s best friends, but Badger Watch farm in deepest rural Dorset has decided to exploit rather than fight Britain’s cutest large mammals. Extremely difficult to spot, a badger seen in the wild is an unforgettable experience. Two specially designed hides at Badger Watch Dorset offer one of the best chances of finding one. Each hide can be booked privately for up to eight people, from 6.30 pm until the lights are shut off at midnight. Alongside badgers, the hides offer a good chance of seeing foxes, deer, and rabbits.", "Holidays are the best opportunity to explore the UK and overseas territories, spending quality time with family or friends including a four-legged one. In fact, holidays are the best excuse to go on some nice dog adventure and give your dog the best time. To plan your perfect holiday, it’s a matter of finding a place suitable for dogs. The good news is that there is more choice than you may think. We found that almost all holiday accommodation and hotels have a filter which you can use to navigate your options, although some are better presented than others.", "The Hebrides are a beautiful archipelago, where Scottish Gaelic is still spoken. Each day will be a combination of relaxation and adventure. On a full day’s excursion, we may spend four or five hours in the kayaks and cover between seven and ten miles, with plenty of opportunities to land and explore islands on foot. One of the best ways to explore its coastline and spot some of the many bird species, otters and seals is by kayak. We can offer full-day guided trips, taking in hidden coves, long sandy beaches, and hidden ancient sites.", "You never forget your first whale. Such sightings are, of course, down to good fortune and timing, but once you’ve seen your first whale, you will want to see another and another. Famous for its whaling fleet, the Yorkshire coast is one of the best places in England to spot Minke whales, which appear in late summer, following the mackerel. From the coastline of the Outer Hebrides, you can spot up to 23 species of whales, more than a quarter of the world’s 89 known species, which pass through the waters off the west coast of Scotland.", "In summer the possibility of finding a calm area away from the crowds of holiday-goers can be a difficult task. Known as the Heritage Coast, the Northumberland coast area of outstanding natural beauty is surprisingly crowd-free, even in high summer. If you’re willing to relax, you’ll find a number of excellent bathing beaches here. Heritage hunters and nature watchers are spoiled with fantastically arresting castles. Most striking is the mighty fortress at Bamburgh. Many architectural historians have declared this the most wondrous of all England’s coastal castles."], "a": [2, 5, 4, 1, 8, 6, 7]},'w4l1-r10')};

 intro:'Задания 12–18 на время: 20 минут. Сначала прочитай вопрос без вариантов и найди ответ в тексте, потом выбери вариант.',sets:rdBuild12({"topic": "travelling", "n": 20, "title": "What it is really like to travel alone", "p": ["My wanderlust started with a Billy Joel song. Yes, some might say it is unwise to visit a city just because of a catchy tune. But that was how I made my way to Austria with only good old Billy as my travel buddy.", "In college, I took part in a spring work/study program in London. And while I loved the U.K. and my job working for a health website, what excited me most was the opportunity to travel. I spent my weekends visiting cafés in Barcelona with my roommates, and admiring Edinburgh accompanied by friends. But no one wanted to stay and explore Europe more extensively after our sixteen weeks were up. So, I decided to do it alone.", "I did not set out wanting to travel by myself. It is something that young women are discouraged from doing. My own mother was desperate to talk me out of the idea. “It’s dangerous for girls to travel by themselves,” she would warn me every time we spoke. I insisted that I knew women my age who had done it, and that I would be fine. My friends back home were skeptical, too. “Wait, no one’s going with you?” they would ask. No doubt they wondered who would be taking photos of me for my posts on the Internet.", "But after convincing them that just because I am a Millennial woman does not mean I have to be constantly surrounded by a team, I had to convince myself to believe it. The night before my departure I was terrified. While everyone else was flying back to the States, I would be on the Chunnel to Paris to start my two-week trip alone. The thought was disabling. I have always been a person who recharges with alone time, but this suddenly seemed like too much to take on, especially in unfamiliar places.", "The journey was liberating. While I was nervous that my first meal alone would be awkward, I was not tempted by the idea of eating takeout in my hostel room, either. So, I faced the fear. I slipped on my formal (albeit a bit wrinkled) jacket, channeled my inner Cool French Girl, and stepped out into the cool spring air of the Montmartre quarter. I was going to dinner.", "It ended up being one of the most memorable dining experiences of my life. I savored the otherworldly steak frites for which the restaurant is famous, observed the elegant Parisian women adorned in their Saturday evening pearls, and even ordered in the language of love. I enjoyed my glass of freshly squeezed orange juice, and devoured a plate of the most delicious eclairs in the entire City of Light. I had no fear of judgment by others, since no one knew me, nor did I know anyone.", "This freedom ended up being one of the most enjoyable aspects of my trip, and for once, that did not mean feeling guilty. I spent hours riding on a water bus in Venice. I decided not to climb the Duomo in Florence because it just seemed like too many stairs. I read for hours in the lush gardens of the Schönbrunn Palace in Vienna. Though the trip was not without its uncomfortable moments, of course, my solo trip was not a mistake – for sure.", "I spent the final hours of my trip wandering around the gorgeous, pastel façade-lined streets of Vienna. About fifteen minutes prior to leaving, I pulled out my iPod and listened to “Vienna.” After the familiar piano trills, Billy’s familiar voice flooded in: “Slow down you crazy child,” he sang. “You’re so ambitious for a juvenile.” I began to cry – partially from exhaustion, perhaps, but mostly because the moment felt intensely profound. Here I was, in a city I had always escaped to in my mind through Billy’s song, closing out the most incredible experience of my life. A little crazy, a little ambitious. All me."], "q": [{"q": "Why did the author decide to travel alone?", "o": ["Her friends had job commitments.", "Her friends were unwilling to travel more widely.", "The author got tired of constant company.", "The author had a long vacation."]}, {"q": "Disabling in Paragraph 4 (“The thought was disabling.”) most probably means…", "o": ["hurting.", "paralyzing.", "encouraging.", "exciting."]}, {"q": "What does the author of the essay aim to do?", "o": ["To entertain the reader by telling her story.", "To describe her personal experience.", "To show how a song can guide one’s life.", "To persuade women to travel alone."]}, {"q": "The author cried when finishing her trip because she …", "o": ["was full of emotions.", "was extremely tired.", "did not want to leave.", "admired the city."]}, {"q": "This freedom in Paragraph 7 (“This freedom ended up being one of the most enjoyable aspects of my trip …”) refers to …", "o": ["not recognizing anyone.", "going out.", "eating what you want.", "not being judged by others."]}, {"q": "Which statement about the author’s restaurant experience is FALSE?", "o": ["The thought of dining alone was uncomfortable.", "The author had a substantial meal.", "Everyone in the restaurant was dressed casually.", "The dining experience was unforgettable."]}, {"q": "The author was not sure her idea to travel alone was good because…", "o": ["no one she knew ever travelled alone.", "it is difficult to take photos when you are alone.", "there was evidence it is dangerous for women.", "her relatives and friends did not support it."]}], "a": [2, 2, 2, 1, 4, 3, 4]},'w4l1-hw-r12')};

async function arinaSyncDone(){
 const rows=await arinaFetchDone();if(!rows)return;
 let changed=false;
 rows.forEach(r=>{
  const id=r.test_id;if(!id||!W3_TASKS[id]&&!(()=>{try{return taskDef(id)}catch(e){return null}})())return;
  const st=w3Get(id);if(st.done)return;
  let reset=0;try{reset=+localStorage.getItem('arinaReset:'+id)||0}catch(e){}
  if(reset&&new Date(r.created_at).getTime()<reset)return; /* учитель открыл задание заново */
  st.done={answers:{},score:+r.score||0,total:+r.max_score||0,date:r.created_at?new Date(r.created_at).toLocaleDateString('ru-RU'):'',pending:false,code:'',legacy:true,server:true};
  delete st.draft;w3Set(id,st);changed=true;
 });
 if(changed){w3Refresh();if(arinaCurLesson&&!document.querySelector('#fullScreenPanel.on, .fullScreen.on'))openLesson(arinaCurLesson[0],arinaCurLesson[1])}
}

function stativeInfo(){
 return '<div class="stativeCompact">'+
 '<div class="stCard"><b>STATE VERBS</b><small>feelings, thoughts, possession, senses, relationships and states · usually NOT Continuous</small><p><strong>Feelings / opinions:</strong> like, love, hate, prefer, adore, dislike, detest, appreciate, care, mind, wish</p><p><strong>Thinking / knowledge:</strong> know, believe, understand, remember, forget, mean, realise, recognise, suppose, doubt, imagine, agree</p><p><strong>Possession / relationship:</strong> have, own, possess, belong, need, want, owe, depend, contain, consist, include, involve</p><p><strong>Senses / appearance:</strong> seem, appear, smell, taste, look, sound, feel</p></div>'+
 '<div class="stCard"><b>DYNAMIC VERBS</b><small>actions and processes · Continuous is common</small><p>run · study · work · play · read · talk · write · travel · cook · build · change · grow · improve · develop</p></div>'+
 '<div class="stCard stBoth"><b>VERBS THAT CAN BE BOTH · MEANING CHANGES</b><small>Learn the meaning, not only the verb.</small>'+
 '<p><strong>think:</strong> I think it is useful. ↔ I am thinking about the problem.</p>'+
 '<p><strong>have:</strong> She has a car. ↔ She is having lunch / a shower / a good time.</p>'+
 '<p><strong>see:</strong> I see what you mean. ↔ I am seeing the dentist tomorrow.</p>'+
 '<p><strong>look:</strong> You look tired. ↔ She is looking at the screen.</p>'+
 '<p><strong>feel:</strong> I feel tired. ↔ I am feeling the fabric.</p>'+
 '<p><strong>taste:</strong> The soup tastes salty. ↔ The chef is tasting the soup.</p>'+
 '<p><strong>smell:</strong> The flowers smell lovely. ↔ He is smelling the flowers.</p>'+
 '<p><strong>appear:</strong> He appears calm. ↔ He is appearing on TV tonight.</p>'+
 '<p><strong>be:</strong> He is rude. ↔ He is being rude today.</p>'+
 '<p><strong>weigh:</strong> The bag weighs 10 kilos. ↔ She is weighing the bag.</p>'+
 '<p><strong>measure:</strong> The room measures 20 m². ↔ They are measuring the room.</p>'+
 '<p><strong>fit:</strong> This jacket fits me. ↔ They are fitting a new kitchen.</p>'+
 '<p><strong>mean:</strong> This sign means stop. ↔ I was not meaning to upset you.</p>'+
 '<p><strong>consider:</strong> I consider him reliable. ↔ We are considering moving abroad.</p>'+
 '<p><strong>expect:</strong> I expect she is at home. ↔ We are expecting guests tonight.</p>'+
 '<p><strong>enjoy:</strong> I enjoy tennis. ↔ I am enjoying the course.</p>'+
 '<p><strong>love / like:</strong> I love this city. ↔ I am loving / liking the experience. <small>(informal/emphatic)</small></p>'+
 '</div>'+
 '<div class="stCard"><b>COMMON MISTAKES</b><p>✕ I am knowing the answer. → ✓ I know the answer.</p><p>✕ She is wanting some water. → ✓ She wants some water.</p><p>✕ He is having a blue bike. → ✓ He has a blue bike.</p><p>✕ This soup is tasting strange. → ✓ This soup tastes strange.</p></div>'+
 '<div class="stCard stTip"><b>USEFUL TIP</b><p>Ask what the verb means <strong>in this sentence</strong>. State/quality/opinion/possession → usually Simple. Deliberate action/process/temporary behaviour → Continuous may be possible.</p></div>'+
 '</div>';
}

function initStudentTest(box,items=quiz){box._items=items.map((q,i)=>({q:q,i:i}));box._pos=0;box._answers=[];showStudentQuestion(box)}
function showStudentQuestion(box){
 const stage=box.querySelector('.wwStage'),item=box._items[box._pos],q=item.q;
 stage.innerHTML='<div class="wwTop"><span>QUESTION '+(box._pos+1)+' / '+box._items.length+'</span></div><div class="wwQ"><p><b>'+(box._pos+1)+'.</b> '+q[0]+'</p><div class="wwOpts">'+q[1].map((o,j)=>'<button type="button" data-i="'+j+'">'+o+'</button>').join('')+'</div></div>';

function showFinalSubmit(box){
 const stage=box.querySelector('.wwStage');
 stage.innerHTML='<div class="wwQ"><p><b>'+box._items.length+' / '+box._items.length+' ANSWERS READY</b></p><p>Ответы готовы к отправке учителю. После отправки повторная попытка будет заблокирована.</p><button class="action" type="button" onclick="submitStudentTest(this)">SUBMIT HOMEWORK</button><div class="submitStatus"></div></div>';
}
async function submitStudentTest(btn){
 const box=btn.closest('.studentTest'),submitKey=box.dataset.submitkey,status=box.querySelector('.submitStatus');
 if(localStorage.getItem('submitted-'+submitKey)){btn.disabled=true;btn.textContent='Уже отправлено';return}
 let good=0;
 const details=box._items.map((it,i)=>{
  const chosen=box._answers[i],correct=+it.q[2];
  if(chosen===correct)good++;
  return {question:it.q[0],chosen_index:chosen,chosen:it.q[1][chosen]??'',correct_index:correct,correct:it.q[1][correct]??'',is_correct:chosen===correct};
 });
 btn.disabled=true;btn.textContent='Отправка...';status.textContent='Сохраняем результат.';
 try{
  const saved=await saveArinaHomework({test_id:submitKey,test_title:box.dataset.title||'Homework',score:good,max_score:box._items.length,answers:box._answers,details});
  const stamp=new Date().toLocaleString('ru-RU');
  localStorage.setItem('submitted-'+submitKey,JSON.stringify({title:box.dataset.title,score:good,total:box._items.length,date:stamp,code:saved?.code||'',answers:box._answers}));
  btn.textContent='Отправлено';
  status.textContent='Результат отправлен учителю. Повторная попытка заблокирована.';
 }catch(e){
  btn.disabled=false;btn.textContent='SUBMIT HOMEWORK';
  status.textContent='Не удалось отправить. Проверь интернет и нажми SUBMIT ещё раз.';
 }
}

 if(!item){stage.innerHTML='<div class="wwQ"><p><b>Тест завершён.</b></p></div>';return}
 const q=item.q;
 stage.innerHTML='<div class="wwTop"><span>QUESTION '+(box._pos+1)+' / '+box._items.length+'</span></div><div class="wwQ"><p><b>'+(box._pos+1)+'.</b> '+q[0]+'</p><div class="wwOpts">'+q[1].map((o,j)=>'<button type="button" data-i="'+j+'">'+o+'</button>').join('')+'</div></div>';
 stage.querySelectorAll('.wwOpts button').forEach(btn=>btn.onclick=()=>{box._answers=box._answers||[];box._answers[box._pos]=+btn.dataset.i;box._pos++;showWordwall(box,key)})
}

async function saveMaterials(inp,key){
 const files=[...inp.files]; if(!files.length)return;
 const db=await openDB(); const tx=db.transaction('files','readwrite'); const st=tx.objectStore('files');
 files.forEach(f=>st.put({id:key+'::'+f.name,key,name:f.name,type:f.type,data:f}));
 tx.oncomplete=()=>showMaterials(key);
}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('ArinaMaterials',1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}

hers and sisters.", "Cats and dogs are the most popular pets in Russia. Some people also keep hamsters, parrots or fish because they are easier to look after in a flat.", "I like shopping when I need something special, but I don’t do it very often. Yes, it is popular in Russia: many people go to shopping centres at weekends, and a lot of people shop online.", "Yes, most Russian teens use the Internet every day for studying and for talking to friends. They can use it almost anywhere, not only at home, because nearly everyone has a smartphone."]}, {"title": "Russia 3 · My region and famous Russians", "src": "ФИПИ, открытый банк · вопросы из интервью 15, 7, 5, 3, 35", "questions": ["What part of Russia do you live in? What is the climate like in your region?", "What are some of the places of interest in your region? Why should a tourist see them?", "Which famous Russian sportsmen do you know and admire? What are they famous for?", "How are children encouraged to do sports in Russian schools?", "What famous Russian inventors do you know? What are they famous for? Name at least one."], "answers": ["I live in … (назови свой регион). The winters here are cold and snowy, and the summers are short but warm.", "There are some old churches, a local history museum and beautiful nature near my town. A tourist should see them to learn how people lived here in the past.", "I admire the figure skater Evgeni Plushenko and the ice hockey player Alexander Ovechkin. Plushenko is famous for his Olympic gold medals, and Ovechkin is one of the best hockey players in the world.", "Children have PE lessons two or three times a week, and many schools have sports clubs. Schools also organise competitions where pupils can win medals and prizes.", "I know Alexander Popov, who is known in Russia as the inventor of the radio. I also know Sergei Korolev, who designed the first space rockets."]}].concat(['shopping','schools','sport'].map(k=>({title:INTERVIEWS[k].title,src:'другая тема',questions:IN
