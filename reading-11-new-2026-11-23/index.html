ork"],"key":[2,5,7,1,3,4],"why":["where introduces a place: meeting places where...","how to carry out... complements shows the visitor","if these are needed... refers to replacement parts","who has been coming... describes a neighbour","which are frequently difficult... describes products","but as... completes not as... but as..."]},{"title":"How Cities Record Their Sounds","paragraphs":["When people describe a city, they often mention its buildings, parks or transport system. Yet every neighbourhood also has a distinctive soundscape, {{A}}. Recording these sounds can reveal details about local life that photographs cannot capture.","In some cities, researchers invite residents to make short audio recordings as they walk through familiar streets. Participants are asked to note the place and time {{B}}. This information helps researchers understand why the same street may sound different in the morning and at night.","A sound map is more than a collection of noisy places. It may include quiet courtyards, birdsong in public gardens and conversations at outdoor markets. These everyday sounds can be meaningful to people {{C}}.","Sound maps may also reveal environmental problems. For example, several recordings from one street might show {{D}}. Planners can then investigate whether changes to traffic routes or road surfaces would make the area more comfortable.","However, recording public spaces requires care. Researchers should avoid publishing private conversations, especially when speakers {{E}}. Many projects therefore focus on general background sounds rather than identifiable voices.","Some sound maps are stored in digital archives and revisited years later. By comparing old and new recordings, future generations may notice changes {{F}}. In this way, a city’s sounds can become part of its cultural history."],"parts":["who associate them with particular memories","which people notice without always paying attention to it","that heavy traffic continues late into the evening","when they create each recording","which are built entirely from photographs","that would otherwise be easy to overlook","have not agreed to be recorded"],"key":[2,4,1,3,7,6],"why":["which describes soundscape","when specifies time of making each recording","who associates people with memories","that clause follows show","have not agreed describes speakers","that would otherwise... describes changes"]}];
