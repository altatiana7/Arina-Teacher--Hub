</style></head><body><header class="top"><a class="back" href="./index.html">← К плану</a><h1>АРИНА · ЕГЭ 2027 · 09.11.2026 · Speaking Corrections</h1></header><main class="shell"><div class="lessonNote"><b>Урок 09.11.2026 · Начало занятия.</b> Прочитай оригинальный ответ Арины. Предложи исправление устно. Переверни карточку и сравни. Правильные ответы оставлены без изменений.</div><nav class="topics" id="topics"></nav><div class="meta"><span id="counter"></span><span id="progress"></span></div><div class="card" id="card" role="button" tabindex="0" aria-label="Перевернуть карточку"><div class="eyebrow" id="side"></div><div class="answer" id="answer"></div><div class="help">Нажми на карточку, чтобы перевернуть</div></div><div class="controls"><button id="prev">← Назад</button><button class="primary" id="flip">Перевернуть</button><button id="next">Далее →</button></div><div class="actions"><button id="speak">Озвучить текст</button><button id="all">Все темы</button><button id="reset">Сначала</button></div><div class="status" id="status"></div></main><script>
const cards=[["Travelling","The last time I traveled was in the fall. I was in China.","The last time I traveled was in the fall. I was in China."],["Travelling","The most important thing before you pact is money and the documents. If you don't have documents, you can go wherever you want.","The most important things to pack are money and documents. If you don't have documents, you can't go wherever you want."],["Travelling","I like to learn something new about the place I came to, and I like to try local food.","I like to learn something new about the place I visit, and I like to try local food."],["Travelling","I usually stay in the hotels because I think it's cheap and safety and comfortable.","I usually stay in hotels because I think they're cheap, safe and comfortable."],["Friendship","I look for honesty and kindness because I think it's very important to quality for friend.","I look for honesty and kindness because I think these qualities are very important in a friend."],["Friendship","Teenagers are constantly under distress, so they need support that can be found in a friend.","Teenagers are constantly under stress, so they need support that they can get from friends."],["Friendship","I spend a couple hours for a day with my friends. When we spend the time with us, we relaxed and not stressed.","I spend a couple of hours a day with my friends. When we spend time together, we feel relaxed and not stressed."],["Friendship","After school, we usually play games and sometimes we eat and drink tea with my friends.","After school, my friends and I usually play games, and sometimes we eat and drink tea together."],["Friendship","My best friend is Terina. I met her in the school where we started our friendship.","My best friend is Terina. I met her at school, where our friendship began."],["Technology","In my daily life, I usually use my smartphone. Wait, my phone and headphones because I really like to listen to music.","In my daily life, I usually use my smartphone and headphones because I really like to listen to music."],["Technology","I think the best invention of mankind is airplanes, because now people can fly as they wanted.","I think the best invention of mankind is the aeroplane because now people can fly whenever they want."],["Technology","I know Alexander Maroiski. He's famous for. He's famous because he created a plane.","I know Alexander Mozhaysky. He's famous because he designed an aeroplane."],["Technology","I think I can't live without a mobile phone for a month because I have to contact with my parents and friends.","I don't think I can live without a mobile phone for a month because I have to contact my parents and friends."]];let topic='All',index=0,flipped=false;const el=id=>document.getElementById(id);function subset(){return cards.map((x,i)=>({...{topic:x[0],front:x[1],back:x[2]},id:i})).filter(x=>topic==='All'||x.topic===topic)}function render(){const items=subset(),c=items[index]||items[0];if(!c)return;el('counter').textContent=(index+1)+' / '+items.length;el('progress').textContent=c.topic;el('side').textContent=flipped?'ПРАВИЛЬНЫЙ ОТВЕТ':'ОТВЕТ АРИНЫ';el('answer').textContent=flipped?c.back:c.front;el('card').classList.toggle('correct',flipped);el('status').textContent=flipped?(c.front===c.back?'Ответ верный — изменений нет.':'Сравни две версии и повтори правильный ответ.'):'Сначала исправь устно, затем проверь.';el('prev').disabled=index===0;el('next').disabled=index===items.length-1;el('topics').innerHTML=['All','Travelling','Friendship','Technology'].map(t=>'<button data-topic="'+t+'" class="'+(topic===t?'active':'')+'">'+(t==='All'?'Все 13':t)+'</button>').join('');el('topics').querySelectorAll('button').forEach(b=>b.onclick=()=>{topic=b.dataset.topic;index=0;flipped=false;render()})}function flip(){flipped=!flipped;render()}function step(v){index=Math.min(Math.max(index+v,0),subset().length-1);flipped=false;render()}el('card').onclick=flip;el('card').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};el('flip').onclick=flip;el('prev').onclick=()=>step(-1);el('next').onclick=()=>step(1);el('all').onclick=()=>{topic='All';index=0;flipped=false;render()};el('reset').onclick=()=>{index=0;flipped=false;render()};el('speak').onclick=()=>{if(!('speechSynthesis'in window)){el('status').textContent='Озвучка не поддерживается браузером.';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(flipped?subset()[index].back:subset()[index].front);u.lang='en-GB';u.rate=.85;speechSynthesis.speak(u)};document.onkeydown=e=>{if(e.target.tagName==='BUTTON')return;if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)};render();
</script></body></html>
