const config={"id":"arina-diagnostic-listening-reading-2026-11","title":"Listening and Reading Diagnostic","label":"Диагностика · аудирование и чтение · на проверку","url":"https://lzxcmrlubhjfdhtqvqzt.supabase.co","key":"sb_publishable_PmyZRwzWne8lqprej4XJQA_XiujtjEI"};
const sections=[{"title":"Listening · Task 1","audio":"https://altatiana7.github.io/Tatyana-English-Hub/teacher-tasks-2026/audio/F0D977-listening.mp3","note":"Match speakers A–F to statements 1–7. There is one extra statement.","text":["1. Diving can be a dangerous experience.","2. Diving is suitable for all kinds of people.","3. Diving can be an educational experience.","4. Diving is a great way to become healthy.","5. Diving can be ruined by bad weather.","6. Diving is quite an expensive sport.","7. Diving can improve your mental health."],"items":[["Speaker A",["1","2","3","4","5","6","7"]],["Speaker B",["1","2","3","4","5","6","7"]],["Speaker C",["1","2","3","4","5","6","7"]],["Speaker D",["1","2","3","4","5","6","7"]],["Speaker E",["1","2","3","4","5","6","7"]],["Speaker F",["1","2","3","4","5","6","7"]]]},{"title":"Listening · Task 2","audio":"https://altatiana7.github.io/Tatyana-English-Hub/katerina-ege-2027/audio/listening-variant-4.mp3","note":"In the recording, skip to the dialogue between Ryan and Ella about gyms after Task 1.","items":[["1. Ryan has been doing sport since he was six.",["True","False","Not stated"]],["2. It’s important for Ella that the gym is close to her place.",["True","False","Not stated"]],["3. Ryan prefers strength training to group workouts.",["True","False","Not stated"]],["4. It’s easy for Ella to find information online.",["True","False","Not stated"]],["5. Ryan has a younger sister.",["True","False","Not stated"]],["6. Ryan’s friend goes to the PowerHouse gym.",["True","False","Not stated"]],["7. Ryan suggests showing Ella the FitZone gym.",["True","False","Not stated"]]]},{"title":"Listening · Tasks 3–9","audio":"https://altatiana7.github.io/Tatyana-English-Hub/katerina-ege-2027/audio/listening-variant-4.mp3","note":"In the recording, skip to the interview about learning languages after Task 2.","items":[["3. What do we learn about the presenter at the beginning of the radio show?",["She runs the show every afternoon.","She has over ten years of experience.","She has learnt English with the ETL Co."]],["4. How old was the speaker when he started learning languages?",["2","6","19"]],["5. The speaker believes that learning French helped him to...",["develop in a positive way.","keep engaged with friends.","miss out on travel experience."]],["6. Before getting into teaching, the speaker worked as a...",["lawyer.","tour guide.","jazz musician."]],["7. According to the speaker, what prevents people from moving to another country?",["Age.","Desires.","Responsibilities."]],["8. What does the speaker NOT mention as a benefit of teaching online?",["Good salary.","Career opportunities.","Flexible working hours."]],["9. What would the speaker do differently if he could?",["Go to another country.","Invest into a community.","Start his own business."]]]},{"title":"Reading · Task 10","note":"Match texts A–G with headings 1–8. There is one extra heading.","text":["A. Figuring out the way you learn best will help you in your academic life. Over the years, researchers and psychologists have tried to understand how we learn. The VARK model proposes that if you are a visual learner, you need to use visuals such as diagrams, charts and colour in your notes. Auditory learners can learn best through listening. Kinaesthetic learners prefer using all their senses or moving around. Of course, we learn through a mix of styles and methods, but one may be more useful than the others.","B. Studying on your own can be productive; however, there are times when studying in a group can be more effective. Studying in a group or with a partner can make the experience more enjoyable. It can provide you with new views and experiences. It can also be helpful in revealing knowledge gaps or gaps in your understanding. For example, when explaining a concept to the members of your study group, you may realise that you get stuck while explaining a step of a process.","C. Our attention span is between 45 to 60 minutes so continuous studying is not as productive as you may think. Taking a break will help you prevent study fatigue and allow you to return to your notes with fresh focus. However, if the breaks are too long, you will lose motivation to return to your studies. Try using the Pomodoro Technique where you balance study and breaks. Set a timer for 25 minutes and completely focus on your task. When the time is up, take a short 3-to-5-minute break.","D. In order to be productive and study efficiently, it is important to reward yourself for your hard work. This can help to keep you motivated and will also reinforce the behaviour. There are several ways that you can reward yourself. Give yourself one evening off once you have achieved your study goals. Reward a study session with a half hour of your favourite show or game. You can take a nap, or meet up with a friend, whatever makes you happy. You complete your study, you get a reward!","E. A popular productivity and time management method used by many around the world, is the “Eat the Frog” technique. This is how it works. First, choose a “frog” (difficult task) for the day. You should try to get your task done early in the day. It helps when you have an assignment with a near deadline, but you are not sure how to start. When a task is difficult, we tend to put it off. By completing the most difficult tasks of the day first thing in the morning, you are putting a stop to procrastination.","F. Most of us buy into the idea that we can multitask effectively, but in reality, we cannot focus on multiple tasks at the same time. What usually happens is that our focus moves from task to task. As a result of this, the task we are trying to complete takes longer, and we are more likely to make mistakes. Instead of multitasking, try to focus on single tasks at a time. You might spend an hour studying with the TV on, but instead focus only on your study for 45 minutes, and this will allow you to watch TV for 15 minutes.","G. When we talk about productivity, it is true that there are some unavoidable distractions that students face. However, there are certain things that we can do to limit distractions and therefore improve our productivity. Firstly, it is important to minimise the use of devices when trying to study or be productive. If we receive a message and we decide not to check it, it will hold our attention. It is best to keep devices out of sight and out of mind. Also, take away smartwatches. They may alert you and break your focus."],"choices":["Small pleasures for big efforts","Study time, digital silence","Beat delay by starting strong","Two heads learn better than one","The smart way to press pause","Learning works differently","Too late to take a break","One thing at a time"],"items":[["Text A",["1","2","3","4","5","6","7","8"]],["Text B",["1","2","3","4","5","6","7","8"]],["Text C",["1","2","3","4","5","6","7","8"]],["Text D",["1","2","3","4","5","6","7","8"]],["Text E",["1","2","3","4","5","6","7","8"]],["Text F",["1","2","3","4","5","6","7","8"]],["Text G",["1","2","3","4","5","6","7","8"]]]},{"title":"Reading · Task 11","note":"Match gaps A–F with fragments 1–7. There is one extra fragment.","text":["Climate change is putting hundreds of millions of people’s lives at risk, and is threatening nature worldwide – from the poles to the tropics, from mountains to oceans. Many of the world’s biggest challenges, from poverty to dying wildlife, are increased by the climate crisis.","Climate change is caused by increasing greenhouse gases in the atmosphere, A__________ the planet’s weather patterns. Such a rise in the average temperature is often referred to as “global warming.” Climate and weather are often confused. Weather refers to short-term changes in atmospheric conditions, B__________ a much longer period. That is why we still experience cold, snowy days, even though we are now facing a climate crisis, C__________.","The impact of climate change can be seen everywhere, from melting glaciers resulting in a global rise in the sea level, D__________, more frequent heatwaves, and other extreme weather events. All these extreme weather events threaten people’s lives and nature across the planet. They are also more difficult E__________. The longer people wait to act, the worse the situation will become.","While climate change is a global crisis, its effects are not felt evenly worldwide. The poorest, native people, and future generations are those F__________ greenhouse gases. However, they are often the most affected by the climate crisis."],"choices":["while climate refers to changes over","resulting in serious, long-term shifts in","who is living in harmony with nature","which has resulted from global warming","who are the least responsible for","and more expensive to recover from","to heavier rainstorms, more droughts"],"items":[["Gap A",["1","2","3","4","5","6","7"]],["Gap B",["1","2","3","4","5","6","7"]],["Gap C",["1","2","3","4","5","6","7"]],["Gap D",["1","2","3","4","5","6","7"]],["Gap E",["1","2","3","4","5","6","7"]],["Gap F",["1","2","3","4","5","6","7"]]]},{"title":"Reading · Tasks 12–18","text":["Taking a gap year after your graduation exams has gone out of fashion. It could be down to its notoriety, now that voluntourism schemes are widely considered self-serving. And then of course there’s the cost, which many students are avoiding in favour of travelling for a month or two. “A lot of my friends take the mick out of me saying, ‘Oh, you went to Cambodia on a gap year’,” says Beth Adams, 21, who studied politics and international relations at the University of Manchester, and took a year out after graduating. “You do feel like you’re fulfilling a stereotype a bit.”","According to researchers, the number of people deferring their university places has gone down from 8% in 2002 to around 5% last year. Instead of postponing university study, many graduates are taking a year out after receiving their degree. According to a survey carried out by YouGov and London Stansted airport, more young people are taking a gap year after university, and almost half of UK adults believe job prospects are enhanced by combining travel and learning. So is it better to save your gap year until after graduating?","Definitely, when you’ve been in education for all those years, where your life is September to July, a break is a good idea. You can recharge your batteries and see the world outside the classroom. You can practise foreign languages and improve your communication skills. You have time to figure things out and a year of being able to work on different projects. As a result, you may land in a job in the industry you like.","Although some take a gap year after university because they have a job lined up and managed to delay their start date, most are yet to secure work and are biding their time. It’s a common misconception that such individuals immediately go abroad to volunteer or travel. In reality, students don’t have the funds to do this. Many prefer to stay in their country juggling internships and part-time work.","For those who do go abroad, a gap-year stint volunteering is no longer merely a way for middle-class kids to boost their CVs. Graduates say they are making more considered choices. The practical experience of working abroad helps some of them get ready for a master’s, which is something they do not have time to do during their finals.","Graduates are also using gap years to explore different career routes. According to recruitment firm Tempo, more than half of students feel there is too much emphasis placed on graduate schemes when starting out in their career. Elena Ricci, 23, who graduated from the University of Southampton last year, agrees. “After I finished my degree, I didn’t really know what to do. So I worked for a law firm for a month, and then I went to Cambodia on a placement. If I had gone straight into a grad job, I don’t think I would have been happy,” she says.","Although graduates can bring great skills to volunteering and enhance their employability, there are some risks attached. “You are delaying your career or further study for a year and some employers may not get why you’ve done it,” says ManuelOtero, a senior lecturer in social sciences at Cardiff University who specialises in the link between education and work. His advice is not to stand still. It makes sense to work out what to do, and one of the best ways to find out what to do is to try it out.","After her year abroad, Ricci has now decided to start a master’s in September. She says graduates should ignore stereotypes and do what works for them. So, do what you want, regardless of what others might say. It’s up to you to decide. What works out for others may not work out for you, and vice versa. You never know till you try."],"items":[["12. Why is taking a gap year going out of fashion, according to Beth Adams?",["It is boring.","It is quite expensive.","It is too long.","It is pointless."]],["13. Deferring in Paragraph 2 most probably means …",["rejecting.","delaying.","getting.","choosing."]],["14. Which advantage of a gap year is NOT mentioned in the text?",["Understanding what you want.","Experiencing a different culture.","Becoming better at languages.","Having a rest and getting new impressions."]],["15. Such individuals in Paragraph 4 (“It’s a common misconception that such individuals immediately go abroad …”) refers to …",["interns and part-time workers.","young people with sufficient funds.","students having sufficient free time.","graduates without a stable job."]],["16. Which statement about Elena Ricci’s experience is FALSE?",["She had a vision of her future job.","She worked abroad for some time.","She worked for a firm for a short time.","She is satisfied with her experience."]],["17. What is the danger of taking a gap year, according to the text?",["Risk of losing important skills.","Having a career in the field you dislike.","Misunderstanding on the part of employers.","Impossibility of further study."]],["18. The author advises that students should …",["study on a master’s programme.","copy what other people do.","follow their own route.","try working after graduation."]]]}];
const id=config.id, headers={apikey:config.key,Authorization:'Bearer '+config.key,'Content-Type':'application/json'};
const form=document.querySelector('form'), nav=document.querySelector('nav'), title=document.querySelector('h1'), note=document.querySelector('#note'), passage=document.querySelector('#passage'), prompts=document.querySelector('#prompts'), status=document.querySelector('#status'), audio=document.querySelector('audio');
let state={answers:{},current:0}, busy=false, remoteReady=false;
try{state=JSON.parse(localStorage.getItem(id))||state}catch{}
function save(){try{localStorage.setItem(id,JSON.stringify(state))}catch{}}
function node(tag,text){const el=document.createElement(tag);el.textContent=text;return el}
function request(method,body){return fetch(config.url+'/rest/v1/rpc/'+method,{method:'POST',headers,body:JSON.stringify(body)})}
async function send(){
 if(busy||state.sent||!state.pending)return;
 busy=true;render();
 try{
  const check=await request('get_arina_done',{});
  const sent=check.ok&&(await check.json()).some(row=>row.test_id===id);
  if(!sent){
   const response=await request('submit_arina_homework',{p_test_id:id,p_test_title:config.label,p_score:0,p_max_score:1,p_answers:{responses:Object.fromEntries(Object.entries(state.answers).map(([key,value])=>{const [i,j]=key.split('-').map(Number);return [sections[i].title+' · '+sections[i].items[j][0],value]})),type:'teacher-review'},p_details:[]});
   if(!response.ok)throw Error('Send failed');
  }
  state.sent=true;state.pending=false;save();
 }catch{status.textContent='Saved on this device. Sending failed. Try again.'}
 finally{busy=false;render()}
}
function go(i){audio.pause();state.current=i;save();render();title.focus()}
function render(){
 const i=state.current, section=sections[i], locked=state.sent||state.pending;
 nav.querySelectorAll('button').forEach((el,j)=>el.setAttribute('aria-current',j===i?'step':'false'));
 title.textContent=section?.title||'Review and send';note.textContent=section?.note||'Open any section to review your answers before sending.';
 if(section?.audio!==audio.getAttribute('src')){if(section?.audio)audio.src=section.audio;else{audio.removeAttribute('src');audio.load()}}
 audio.hidden=!section?.audio;passage.replaceChildren();prompts.replaceChildren();
 passage.hidden=!(section?.text||section?.choices);
 section?.text?.forEach(text=>passage.append(node('p',text)));
 section?.choices?.forEach((text,k)=>passage.append(node('p',(k+1)+'. '+text)));
 if(section){section.items.forEach(([q,options],j)=>{
  const field=node('label',q), control=document.createElement(options?'select':'input'), key=i+'-'+j;
  if(options){control.add(new Option('Choose an answer',''));options.forEach(o=>control.add(new Option(o,o)))}
  else{control.autocomplete='off';control.spellcheck=false}
  control.value=state.answers[key]||'';control.disabled=locked;
  control.addEventListener('input',()=>{if(control.value.trim())state.answers[key]=control.value;else delete state.answers[key];save()});
  field.append(control);prompts.append(field);
 })}else{
  sections.forEach((s,j)=>{
   const count=s.items.filter((_,k)=>state.answers[j+'-'+k]).length;
   prompts.append(node('p',s.title+' · '+count+' / '+s.items.length+' answered'));
  });
  if(!state.sent){const submit=node('button',state.pending?'Retry sending':'Send to your teacher');submit.disabled=busy||(!state.pending&&!remoteReady);prompts.append(submit)}
 }
 document.querySelector('#back').disabled=i===0;
 document.querySelector('#next').disabled=i===sections.length;
 status.textContent=state.sent?'Sent to your teacher.':busy?'Sending…':state.pending?'Saved on this device. Retry sending to finish.':'';
}
sections.concat({title:'Review and send'}).forEach((s,i)=>{const button=node('button',s.title);button.type='button';button.onclick=()=>go(i);nav.append(button)});
document.querySelector('#back').onclick=()=>go(state.current-1);
document.querySelector('#next').onclick=()=>go(state.current+1);
form.onsubmit=e=>{
 e.preventDefault();
 if(state.sent||busy)return;
 if(!state.pending){
  const answered=Object.keys(state.answers).length,total=sections.reduce((n,s)=>n+s.items.length,0);
  if(answered===0){status.textContent='Answer at least one question before sending.';return}
  if(!confirm('Send '+answered+' of '+total+' answers? You cannot edit them afterwards.'))return;
  state.pending=true;save();
 }
 send();
};
async function sync(){
 if(state.pending){send();return}
 if(!state.sent)try{const r=await request('get_arina_done',{});if(r.ok){state.sent=(await r.json()).some(row=>row.test_id===id);save()}}catch{}
 remoteReady=true;render();
}
window.addEventListener('online',sync);render();sync();
</script></body></html>
